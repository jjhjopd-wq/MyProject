<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SONAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');
:root {
  --g:#00ff88; --gd:rgba(0,255,136,0.35); --gb:rgba(0,255,136,0.07);
  --am:#ffb800; --rd:#ff4444;
  --bg:#010a04; --panel:#020e05; --grid:rgba(0,80,30,0.35); --td:#005522;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--g);
  font-family:'Share Tech Mono',monospace;overflow:hidden;touch-action:manipulation;}
body::before{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:9999;}
#app{display:flex;flex-direction:column;height:100%;padding:6px;gap:5px;}

header{display:flex;justify-content:space-between;align-items:center;
  padding:4px 10px;border:1px solid var(--grid);background:var(--panel);border-radius:3px;flex-shrink:0;}
.logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:8px;text-shadow:0 0 10px var(--g);}
.hstat{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--td);}
#dot{width:7px;height:7px;border-radius:50%;background:var(--td);flex-shrink:0;transition:all .3s;}
#dot.on{background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 1.2s infinite;}
#dot.tx{background:var(--am);box-shadow:0 0 8px var(--am);animation:none;}
#dot.rx{background:var(--rd);box-shadow:0 0 8px var(--rd);animation:blink .4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* MAIN ECHO DISPLAY */
#echoPanel{flex:1;min-height:0;border:1px solid var(--grid);background:var(--panel);
  border-radius:3px;position:relative;overflow:hidden;}
#echoPanel canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.plabel{position:absolute;top:4px;left:8px;font-size:9px;color:var(--td);
  letter-spacing:2px;z-index:2;pointer-events:none;}
#rangeMarker{position:absolute;top:2px;right:8px;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;
  text-shadow:0 0 10px var(--g);z-index:2;pointer-events:none;}

/* WATERFALL */
#wfPanel{flex:0 0 70px;border:1px solid var(--grid);background:var(--panel);
  border-radius:3px;position:relative;overflow:hidden;}
#wfPanel canvas{position:absolute;top:0;left:0;width:100%;height:100%;}

/* CONTROLS */
#controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;flex-shrink:0;}
.cbox{background:var(--panel);border:1px solid var(--grid);border-radius:3px;padding:5px 7px;}
.clabel{font-size:8px;color:var(--td);letter-spacing:2px;}
.cval{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;line-height:1.2;
  text-shadow:0 0 6px var(--g);}
.cunit{font-size:9px;color:var(--td);margin-left:1px;}
input[type=range]{width:100%;margin-top:3px;-webkit-appearance:none;
  height:2px;background:var(--grid);outline:none;border-radius:1px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;background:var(--g);
  box-shadow:0 0 5px var(--g);cursor:pointer;}

/* BUTTONS */
#btnRow{display:flex;gap:5px;flex-shrink:0;}
#btnFire{flex:1;padding:13px 0;background:var(--gb);border:2px solid var(--g);
  color:var(--g);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:5px;border-radius:3px;cursor:pointer;
  text-shadow:0 0 8px var(--g);transition:all .1s;
  -webkit-tap-highlight-color:transparent;user-select:none;}
#btnFire:active,#btnFire.busy{background:var(--gd);transform:scale(.97);}
#btnFire.busy{border-color:var(--am);color:var(--am);text-shadow:0 0 8px var(--am);}
.btnS{padding:13px 12px;background:transparent;border:1px solid var(--grid);
  color:var(--td);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  border-radius:3px;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;user-select:none;}
.btnS.on{border-color:var(--am);color:var(--am);box-shadow:0 0 8px rgba(255,184,0,.2);}

/* STATS */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex-shrink:0;}
.sbox{background:var(--panel);border:1px solid var(--grid);border-radius:3px;
  padding:4px 5px;text-align:center;}
.slabel{font-size:8px;color:var(--td);letter-spacing:1px;}
.sval{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;}
.sval.hi{color:var(--am);}
#msg{text-align:center;font-size:10px;color:var(--am);letter-spacing:1px;
  min-height:15px;flex-shrink:0;padding:0 4px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">SONAR</div>
    <div class="hstat"><div id="dot"></div><span id="stxt">STANDBY</span></div>
  </header>

  <div id="echoPanel">
    <div class="plabel">ECHO STRENGTH · RANGE</div>
    <div id="rangeMarker">—</div>
    <canvas id="echoCanvas"></canvas>
  </div>

  <div id="wfPanel">
    <div class="plabel">FREQ WATERFALL (TX ±3kHz)</div>
    <canvas id="wfCanvas"></canvas>
  </div>

  <div id="controls">
    <div class="cbox">
      <div class="clabel">TX FREQ</div>
      <div><span class="cval" id="vFreq">18000</span><span class="cunit">Hz</span></div>
      <input type="range" id="sFreq" min="17000" max="19000" step="250" value="18000">
    </div>
    <div class="cbox">
      <div class="clabel">PULSE</div>
      <div><span class="cval" id="vPulse">10</span><span class="cunit">ms</span></div>
      <input type="range" id="sPulse" min="5" max="50" step="5" value="10">
    </div>
    <div class="cbox">
      <div class="clabel">THRESHOLD</div>
      <div><span class="cval" id="vThr">3</span><span class="cunit">×</span></div>
      <input type="range" id="sThr" min="1" max="10" step="0.5" value="3">
    </div>
  </div>

  <div id="btnRow">
    <button id="btnFire">▶ PING</button>
    <button class="btnS" id="btnAuto">AUTO</button>
    <button class="btnS" id="btnClear">CLR</button>
  </div>

  <div id="stats">
    <div class="sbox"><div class="slabel">RANGE</div><div class="sval" id="svRange">—</div></div>
    <div class="sbox"><div class="slabel">TOF</div><div class="sval" id="svTof">—</div></div>
    <div class="sbox"><div class="slabel">SNR</div><div class="sval" id="svSnr">—</div></div>
    <div class="sbox"><div class="slabel">CONF</div><div class="sval" id="svConf">—</div></div>
  </div>
  <div id="msg"></div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════
   CONSTANTS
══════════════════════════════════════ */
const SOUND_SPEED = 343;    // m/s
const FFT_SIZE    = 8192;   // high freq resolution (~5Hz/bin @44100)
const WINDOW_MS   = 500;    // RX listen window
const IGNORE_MS   = 15;     // blank TX direct blast
const BW_HZ       = 500;    // bandpass ±Hz around TX freq

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let actx = null, analyser = null;
let busy = false, autoMode = false, autoTid = null;
let traces   = [];   // last N echo curves for persistence display
let wfRows   = [];   // waterfall
const MAX_TRACES = 25;
const MAX_WF     = 60;

/* ══════════════════════════════════════
   CANVAS
══════════════════════════════════════ */
const echoC = document.getElementById('echoCanvas');
const echoX = echoC.getContext('2d');
const wfC   = document.getElementById('wfCanvas');
const wfX   = wfC.getContext('2d');

function layout() {
  requestAnimationFrame(() => {
    const ep = document.getElementById('echoPanel');
    echoC.width  = ep.clientWidth  || 360;
    echoC.height = ep.clientHeight || 200;
    const wf = document.getElementById('wfPanel');
    wfC.width  = wf.clientWidth  || 360;
    wfC.height = wf.clientHeight || 70;
    redrawAll();
  });
}
window.addEventListener('resize', layout);

/* ══════════════════════════════════════
   SLIDERS
══════════════════════════════════════ */
[['sFreq','vFreq'],['sPulse','vPulse'],['sThr','vThr']].forEach(([sid,vid]) => {
  document.getElementById(sid).addEventListener('input', () => {
    document.getElementById(vid).textContent = document.getElementById(sid).value;
  });
});

/* ══════════════════════════════════════
   AUDIO INIT
══════════════════════════════════════ */
async function initAudio() {
  if (actx && analyser) return true;
  try {
    // Request 48kHz if possible — better high-freq response
    actx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000,
      latencyHint: 'interactive'
    });
    if (actx.state === 'suspended') await actx.resume();

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    });

    const src = actx.createMediaStreamSource(stream);

    // High-shelf boost for 17-19kHz before analysis
    const hiShelf = actx.createBiquadFilter();
    hiShelf.type = 'highshelf';
    hiShelf.frequency.value = 16000;
    hiShelf.gain.value = 12; // +12dB boost above 16kHz

    analyser = actx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0;

    src.connect(hiShelf);
    hiShelf.connect(analyser);

    setStatus('on', 'READY');
    setMsg('');
    return true;
  } catch(e) {
    setMsg('마이크 오류: ' + e.message);
    setStatus('', 'ERROR');
    return false;
  }
}

/* ══════════════════════════════════════
   TRANSMIT
   Chirp sweep TX_FREQ ± 500Hz for better
   correlation than pure tone
══════════════════════════════════════ */
function transmit(centerHz, durMs) {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  const t    = actx.currentTime;
  const dur  = durMs / 1000;

  // Linear chirp: center-500 → center+500
  osc.type = 'sine';
  osc.frequency.setValueAtTime(centerHz - 500, t);
  osc.frequency.linearRampToValueAtTime(centerHz + 500, t + dur);

  // Hanning window envelope
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.95, t + dur * 0.1);
  gain.gain.setValueAtTime(0.95, t + dur * 0.9);
  gain.gain.linearRampToValueAtTime(0, t + dur);

  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.005);
}

/* ══════════════════════════════════════
   BAND POWER
   Mean linear power in [center-bw, center+bw]
══════════════════════════════════════ */
function bandPower(freqData, centerHz, bwHz, sr) {
  const binHz = sr / FFT_SIZE;
  const b0 = Math.max(0,              Math.floor((centerHz - bwHz) / binHz));
  const b1 = Math.min(freqData.length-1, Math.ceil((centerHz + bwHz) / binHz));
  let sum = 0;
  for (let b = b0; b <= b1; b++) {
    sum += Math.pow(10, freqData[b] / 10); // dB → linear power
  }
  return sum / Math.max(1, b1 - b0 + 1);
}

/* ══════════════════════════════════════
   PING
══════════════════════════════════════ */
async function doPing() {
  if (busy) return;
  if (!await initAudio()) return;

  busy = true;
  setBusy(true);
  setMsg('');

  const freq    = parseInt(document.getElementById('sFreq').value);
  const pulseMs = parseInt(document.getElementById('sPulse').value);
  const thrMult = parseFloat(document.getElementById('sThr').value);
  const sr      = actx.sampleRate;

  // ── TX ──
  setStatus('tx', 'TX ▶');
  transmit(freq, pulseMs);

  // Wait: full pulse + guard time
  await sleep(pulseMs + Math.max(20, pulseMs));

  // ── MEASURE NOISE FLOOR (3 frames before RX) ──
  setStatus('rx', 'RX ●');
  const freqBuf = new Float32Array(analyser.frequencyBinCount);
  let noiseAcc = 0;
  const noiseFrames = 3;
  for (let i = 0; i < noiseFrames; i++) {
    await nextFrame();
    analyser.getFloatFrequencyData(freqBuf);
    noiseAcc += bandPower(freqBuf, freq, BW_HZ, sr);
  }
  const noiseFloor = Math.max(noiseAcc / noiseFrames, 1e-12);

  // ── COLLECT RX FRAMES ──
  // ms per frame = FFT_SIZE / sampleRate * 1000
  const msPerFrame = FFT_SIZE / sr * 1000;
  const nFrames    = Math.ceil(WINDOW_MS / msPerFrame);
  const pts = []; // {t_ms, snr}

  for (let i = 0; i < nFrames; i++) {
    await nextFrame();
    analyser.getFloatFrequencyData(freqBuf);
    const pw  = bandPower(freqBuf, freq, BW_HZ, sr);
    const snr = pw / noiseFloor;
    const t   = i * msPerFrame;
    pts.push({ t, snr });

    // Store waterfall row (copy)
    wfRows.push(new Float32Array(freqBuf));
    if (wfRows.length > MAX_WF) wfRows.shift();
  }

  processEcho(pts, thrMult, freq, sr);

  busy = false;
  setBusy(false);
  setStatus('on', 'READY');
}

/* ══════════════════════════════════════
   PROCESS ECHO
══════════════════════════════════════ */
function processEcho(pts, thrMult, freq, sr) {
  // 3-point smoothing
  const sm = pts.map((p, i) => {
    const a = pts[Math.max(0, i-1)].snr;
    const b = p.snr;
    const c = pts[Math.min(pts.length-1, i+1)].snr;
    return { t: p.t, snr: (a + b*2 + c) / 4 }; // weighted centre
  });

  const maxSnr = Math.max(...sm.map(p => p.snr), 1);

  // First peak above (noiseFloor × thrMult) after IGNORE_MS
  let echoPt = null;
  for (const p of sm) {
    if (p.t < IGNORE_MS) continue;
    if (p.snr >= thrMult) { echoPt = p; break; }
  }

  const tof   = echoPt ? echoPt.t : null;
  const range = tof    ? (tof / 1000) * SOUND_SPEED / 2 : null;
  const snrDb = echoPt ? (10 * Math.log10(echoPt.snr)).toFixed(1) : null;
  const conf  = echoPt ? Math.min(100, Math.round((echoPt.snr / maxSnr) * 100)) : 0;

  // Update UI
  const rv = document.getElementById('svRange');
  if (range !== null && range < 20) {
    rv.textContent = range.toFixed(2) + 'm';
    document.getElementById('rangeMarker').textContent = range.toFixed(2) + 'm';
    rv.classList.toggle('hi', range < 1.0);
  } else {
    rv.textContent = 'N/D';
    document.getElementById('rangeMarker').textContent = '—';
    rv.classList.remove('hi');
  }
  document.getElementById('svTof').textContent  = tof   ? tof.toFixed(1)+'ms' : '—';
  document.getElementById('svSnr').textContent  = snrDb ? snrDb+'dB'          : '—';
  document.getElementById('svConf').textContent = echoPt ? conf+'%'           : '—';

  if (!echoPt) {
    setMsg('에코 미감지 — THRESHOLD를 낮추거나 TX FREQ 변경');
  } else {
    setMsg('');
  }

  // Store normalised trace
  traces.push(sm.map(p => ({ t: p.t, v: p.snr / maxSnr })));
  if (traces.length > MAX_TRACES) traces.shift();

  drawEcho(sm, maxSnr, tof, thrMult);
  drawWaterfall(freq, sr);
}

/* ══════════════════════════════════════
   DRAW: ECHO
══════════════════════════════════════ */
function drawEcho(pts, maxSnr, tofMs, thrMult) {
  const W = echoC.width, H = echoC.height;
  echoX.clearRect(0, 0, W, H);

  // Grid
  echoX.strokeStyle = 'rgba(0,60,20,0.35)';
  echoX.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = (i / 10) * W;
    echoX.beginPath(); echoX.moveTo(x,0); echoX.lineTo(x,H); echoX.stroke();
  }
  for (let i = 0; i <= 4; i++) {
    const y = (i / 4) * H;
    echoX.beginPath(); echoX.moveTo(0,y); echoX.lineTo(W,y); echoX.stroke();
  }

  // Range axis labels
  echoX.fillStyle = 'rgba(0,120,60,0.7)';
  echoX.font = '8px Share Tech Mono';
  echoX.textAlign = 'center';
  for (let i = 1; i <= 10; i++) {
    const tMs  = WINDOW_MS * i / 10;
    const dist = (tMs / 1000) * SOUND_SPEED / 2;
    if (dist < 100) echoX.fillText(dist.toFixed(1)+'m', (i/10)*W, H-3);
  }

  if (!pts || !pts.length) {
    echoX.fillStyle = 'rgba(0,150,70,0.4)';
    echoX.font = '11px Share Tech Mono';
    echoX.textAlign = 'center';
    echoX.fillText('PING 버튼을 눌러 시작', W/2, H/2);
    return;
  }

  // Older traces (persistence / afterglow)
  for (let ti = 0; ti < traces.length - 1; ti++) {
    const age = traces.length - 1 - ti;
    const alpha = Math.max(0, 0.3 - age * 0.012);
    if (alpha <= 0) continue;
    const tr = traces[ti];
    echoX.beginPath();
    echoX.strokeStyle = `rgba(0,255,136,${alpha})`;
    echoX.lineWidth = 1;
    for (let j = 0; j < tr.length; j++) {
      const px = (tr[j].t / WINDOW_MS) * W;
      const py = H - tr[j].v * (H - 14) - 7;
      j === 0 ? echoX.moveTo(px, py) : echoX.lineTo(px, py);
    }
    echoX.stroke();
  }

  // TX ignore zone
  const ignX = (IGNORE_MS / WINDOW_MS) * W;
  echoX.fillStyle = 'rgba(255,60,60,0.05)';
  echoX.fillRect(0, 0, ignX, H);
  echoX.strokeStyle = 'rgba(255,80,80,0.25)';
  echoX.lineWidth = 1;
  echoX.setLineDash([3,3]);
  echoX.beginPath(); echoX.moveTo(ignX,0); echoX.lineTo(ignX,H); echoX.stroke();
  echoX.setLineDash([]);

  // Threshold line (SNR = thrMult, normalised)
  const thrNorm = Math.min(thrMult / maxSnr, 1);
  const thrY = H - thrNorm * (H - 14) - 7;
  echoX.strokeStyle = 'rgba(255,184,0,0.45)';
  echoX.lineWidth = 1;
  echoX.setLineDash([5,4]);
  echoX.beginPath(); echoX.moveTo(0,thrY); echoX.lineTo(W,thrY); echoX.stroke();
  echoX.setLineDash([]);
  echoX.fillStyle = 'rgba(255,184,0,0.6)';
  echoX.font = '8px Share Tech Mono';
  echoX.textAlign = 'left';
  echoX.fillText('THR', 4, thrY - 3);

  // Current trace fill
  echoX.beginPath();
  echoX.moveTo(0, H);
  for (let i = 0; i < pts.length; i++) {
    const px = (pts[i].t / WINDOW_MS) * W;
    const py = H - (pts[i].snr / maxSnr) * (H - 14) - 7;
    echoX.lineTo(px, py);
  }
  echoX.lineTo(W, H);
  echoX.closePath();
  const fg = echoX.createLinearGradient(0, 0, 0, H);
  fg.addColorStop(0, 'rgba(0,255,136,0.45)');
  fg.addColorStop(1, 'rgba(0,255,136,0.02)');
  echoX.fillStyle = fg;
  echoX.fill();

  // Current trace line
  echoX.beginPath();
  echoX.strokeStyle = '#00ff88';
  echoX.lineWidth = 2;
  echoX.shadowBlur = 6; echoX.shadowColor = '#00ff88';
  for (let i = 0; i < pts.length; i++) {
    const px = (pts[i].t / WINDOW_MS) * W;
    const py = H - (pts[i].snr / maxSnr) * (H - 14) - 7;
    i === 0 ? echoX.moveTo(px, py) : echoX.lineTo(px, py);
  }
  echoX.stroke();
  echoX.shadowBlur = 0;

  // TOF / echo marker
  if (tofMs !== null) {
    const tx = (tofMs / WINDOW_MS) * W;
    // Vertical line
    echoX.strokeStyle = '#ffb800';
    echoX.lineWidth = 2;
    echoX.shadowBlur = 8; echoX.shadowColor = '#ffb800';
    echoX.setLineDash([3,3]);
    echoX.beginPath(); echoX.moveTo(tx,0); echoX.lineTo(tx,H); echoX.stroke();
    echoX.setLineDash([]);
    echoX.shadowBlur = 0;
    // Label
    const range = (tofMs / 1000) * SOUND_SPEED / 2;
    echoX.fillStyle = '#ffb800';
    echoX.font = 'bold 10px Share Tech Mono';
    echoX.textAlign = tx > W * 0.72 ? 'right' : 'left';
    echoX.fillText('◆ ' + range.toFixed(2) + 'm', tx + (tx > W*0.72 ? -5 : 5), 18);
    // Dot at peak
    const peakPt = pts.find(p => Math.abs(p.t - tofMs) < (WINDOW_MS / pts.length) * 1.5);
    if (peakPt) {
      const py = H - (peakPt.snr / maxSnr) * (H - 14) - 7;
      echoX.beginPath(); echoX.arc(tx, py, 5, 0, Math.PI*2);
      echoX.fillStyle = '#ffb800';
      echoX.shadowBlur = 10; echoX.shadowColor = '#ffb800';
      echoX.fill(); echoX.shadowBlur = 0;
    }
  }
}

/* ══════════════════════════════════════
   DRAW: WATERFALL
══════════════════════════════════════ */
function drawWaterfall(txFreq, sr) {
  const W = wfC.width, H = wfC.height;
  wfX.clearRect(0, 0, W, H);

  if (!wfRows.length) {
    wfX.fillStyle = 'rgba(0,80,40,0.5)';
    wfX.font = '9px Share Tech Mono';
    wfX.textAlign = 'center';
    wfX.fillText('AWAITING SIGNAL', W/2, H/2+3);
    return;
  }

  const freq  = txFreq || parseInt(document.getElementById('sFreq').value);
  const rate  = sr     || (actx ? actx.sampleRate : 48000);
  const bins  = wfRows[0].length;
  const binHz = rate / FFT_SIZE;
  const span  = 3000;
  const bMin  = Math.max(0,      Math.floor((freq - span) / binHz));
  const bMax  = Math.min(bins-1, Math.ceil( (freq + span) / binHz));
  const bSpan = bMax - bMin;
  const rowH  = Math.max(1, H / wfRows.length);

  for (let r = 0; r < wfRows.length; r++) {
    const row = wfRows[r];
    const y   = H - (r + 1) * rowH;
    for (let b = 0; b < bSpan; b++) {
      const bi   = Math.min(bMin + b, row.length - 1);
      const db   = row[bi];
      const norm = Math.min(1, Math.max(0, (db + 80) / 60));
      const bx   = (b / bSpan) * W;
      const bw   = W / bSpan + 1;
      let R, G, B;
      if (norm < 0.4)      { R=0; G=Math.floor(norm/0.4*160); B=0; }
      else if (norm < 0.7) { const t=(norm-0.4)/0.3; R=0; G=Math.floor(160+t*80); B=Math.floor(t*80); }
      else                 { const t=(norm-0.7)/0.3; R=Math.floor(t*240); G=Math.floor(240+t*15); B=Math.floor(80+t*120); }
      wfX.fillStyle = `rgb(${R},${G},${B})`;
      wfX.fillRect(bx, y, bw, rowH + 1);
    }
  }

  // TX freq centre line
  wfX.strokeStyle = 'rgba(255,184,0,0.7)';
  wfX.lineWidth = 1.5;
  wfX.setLineDash([2,3]);
  wfX.beginPath(); wfX.moveTo(W/2, 0); wfX.lineTo(W/2, H); wfX.stroke();
  wfX.setLineDash([]);
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function nextFrame() { return new Promise(r => requestAnimationFrame(r)); }
function sleep(ms)   { return new Promise(r => setTimeout(r, ms)); }
function setStatus(cls, txt) {
  document.getElementById('dot').className = cls;
  document.getElementById('stxt').textContent = txt;
}
function setMsg(m) { document.getElementById('msg').textContent = m; }
function setBusy(on) {
  const b = document.getElementById('btnFire');
  b.classList.toggle('busy', on);
  b.textContent = on ? '● MEASURING' : '▶ PING';
}
function redrawAll() {
  drawEcho(null, 1, null, 3);
  drawWaterfall();
}

/* ══════════════════════════════════════
   AUTO MODE
══════════════════════════════════════ */
document.getElementById('btnAuto').addEventListener('click', () => {
  autoMode = !autoMode;
  document.getElementById('btnAuto').classList.toggle('on', autoMode);
  if (autoTid) { clearInterval(autoTid); autoTid = null; }
  if (autoMode) {
    autoTid = setInterval(() => { if (!busy) doPing(); }, WINDOW_MS + 600);
  }
});

document.getElementById('btnClear').addEventListener('click', () => {
  traces = []; wfRows = [];
  ['svRange','svTof','svSnr','svConf'].forEach(id => {
    document.getElementById(id).textContent = '—';
    document.getElementById(id).classList.remove('hi');
  });
  document.getElementById('rangeMarker').textContent = '—';
  setMsg('');
  redrawAll();
});

/* ══════════════════════════════════════
   FIRE BUTTON
══════════════════════════════════════ */
let fp = false;
document.getElementById('btnFire').addEventListener('pointerdown', async e => {
  e.preventDefault();
  if (fp || busy) return;
  fp = true;
  await doPing();
  fp = false;
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
layout();

if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  setMsg('⚠ HTTPS / localhost 환경에서만 마이크 사용 가능');
}
</script>
