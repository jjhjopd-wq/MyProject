<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SONAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;700&display=swap');

:root {
  --g:  #00ff88;
  --g2: #00cc66;
  --gd: rgba(0,255,136,0.18);
  --gb: rgba(0,255,136,0.06);
  --am: #ffb800;
  --rd: #ff4455;
  --cy: #00cfff;
  --bg: #010a04;
  --p0: #020e05;
  --p1: #031208;
  --gr: rgba(0,90,35,0.3);
  --td: #005522;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  background:var(--bg);
  color:var(--g);
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}

/* CRT lines */
body::after {
  content:'';
  position:fixed; inset:0;
  background:repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.055) 2px, rgba(0,0,0,0.055) 4px
  );
  pointer-events:none; z-index:9999;
}

/* ── LAYOUT ── */
#app {
  display: grid;
  grid-template-rows: 38px 1fr 1fr 100px 44px 36px;
  height: 100%;
  padding: 5px;
  gap: 5px;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  background: var(--p0);
  border: 1px solid var(--gr);
  border-radius: 3px;
}
.logo {
  font-family:'Rajdhani',sans-serif;
  font-weight:700; font-size:17px;
  letter-spacing:7px;
  text-shadow:0 0 10px var(--g);
}
.hright { display:flex; gap:12px; align-items:center; }
.hstat  { display:flex; gap:6px; align-items:center; font-size:9px; color:var(--td); }
#dot    { width:7px; height:7px; border-radius:50%; background:var(--td); transition:all .25s; }
#dot.on { background:var(--g); box-shadow:0 0 7px var(--g); animation:blink 1.2s infinite; }
#dot.tx { background:var(--am); box-shadow:0 0 7px var(--am); animation:pulse .3s infinite; }
#dot.rx { background:var(--rd); box-shadow:0 0 7px var(--rd); animation:pulse .15s infinite; }
@keyframes blink  { 0%,100%{opacity:1} 50%{opacity:.2} }
@keyframes pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

/* vibrate icon */
#vibIcon { font-size:14px; opacity:.35; transition:opacity .2s; }
#vibIcon.on { opacity:1; animation:vibrate .15s infinite; }
@keyframes vibrate { 0%,100%{transform:translateX(0)} 50%{transform:translateX(2px)} }

/* ── PANELS ── */
.panel {
  background: var(--p0);
  border: 1px solid var(--gr);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
.panel canvas {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  display:block;
}
.plabel {
  position:absolute; top:4px; left:8px;
  font-size:8px; color:var(--td);
  letter-spacing:2px; z-index:3; pointer-events:none;
}
.pbadge {
  position:absolute; top:3px; right:8px;
  font-family:'Rajdhani',sans-serif; font-weight:700;
  font-size:20px; z-index:3; pointer-events:none;
  text-shadow:0 0 8px currentColor;
}

/* TX panel badge */
#txBadge  { color:var(--am); }
/* RX panel badge */
#rxBadge  { color:var(--g); }

/* ── SPECTRUM PANEL ── */
/* (full freq — 100px tall fixed) */
#specPanel { /* set by grid row */ }

/* ── CONTROLS ROW ── */
#ctrlRow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
}
.cbox {
  background:var(--p0);
  border:1px solid var(--gr);
  border-radius:3px;
  padding:4px 7px;
}
.clabel { font-size:7px; color:var(--td); letter-spacing:2px; display:block; }
.cval   {
  font-family:'Rajdhani',sans-serif;
  font-weight:700; font-size:16px;
  line-height:1.1; color:var(--g);
  text-shadow:0 0 5px var(--g);
}
.cunit  { font-size:8px; color:var(--td); }
input[type=range] {
  width:100%; margin-top:3px;
  -webkit-appearance:none;
  height:2px; background:var(--gr);
  outline:none; border-radius:1px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:13px; height:13px; border-radius:50%;
  background:var(--g); box-shadow:0 0 4px var(--g);
  cursor:pointer;
}

/* ── BUTTON ROW ── */
#btnRow { display:flex; gap:5px; }
#btnFire {
  flex:1; padding:0;
  background:var(--gb);
  border:2px solid var(--g);
  color:var(--g);
  font-family:'Rajdhani',sans-serif;
  font-weight:700; font-size:16px;
  letter-spacing:5px;
  border-radius:3px; cursor:pointer;
  text-shadow:0 0 7px var(--g);
  transition:all .1s;
}
#btnFire:active { background:var(--gd); transform:scale(.97); }
#btnFire.on {
  background:rgba(255,68,85,0.12);
  border-color:var(--rd);
  color:var(--rd);
  text-shadow:0 0 7px var(--rd);
}
.btnS {
  padding:0 13px;
  background:transparent;
  border:1px solid var(--gr);
  color:var(--td);
  font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:2px;
  border-radius:3px; cursor:pointer;
  transition:all .2s;
}
.btnS.on { border-color:var(--am); color:var(--am); box-shadow:0 0 7px rgba(255,184,0,.2); }

/* ── STATUS BAR ── */
#statBar {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}
.sbox {
  background:var(--p0);
  border:1px solid var(--gr);
  border-radius:3px;
  padding:3px 5px; text-align:center;
}
.slabel { font-size:7px; color:var(--td); letter-spacing:1px; }
.sval   {
  font-family:'Rajdhani',sans-serif;
  font-weight:700; font-size:13px; line-height:1.1;
}
.sval.hi { color:var(--am); animation:blink .5s infinite; }

/* ── TOAST MSG ── */
#toast {
  position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
  background:rgba(255,68,85,0.85);
  color:#fff; font-size:11px; letter-spacing:1px;
  padding:6px 14px; border-radius:20px;
  opacity:0; transition:opacity .3s;
  pointer-events:none; z-index:9998;
}
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="logo">SONAR</div>
    <div class="hright">
      <div id="vibIcon">📳</div>
      <div class="hstat"><div id="dot"></div><span id="stxt">STANDBY</span></div>
    </div>
  </header>

  <!-- TX PANEL: transmit timing & waveform -->
  <div class="panel" id="txPanel">
    <div class="plabel">TX · 송신 신호</div>
    <div class="pbadge" id="txBadge">—</div>
    <canvas id="txCanvas"></canvas>
  </div>

  <!-- RX PANEL: realtime received waveform + echo envelope -->
  <div class="panel" id="rxPanel">
    <div class="plabel">RX · 수신 신호 (실시간)</div>
    <div class="pbadge" id="rxBadge">—</div>
    <canvas id="rxCanvas"></canvas>
  </div>

  <!-- SPECTRUM PANEL: full 20Hz~24kHz with TX marker -->
  <div class="panel" id="specPanel">
    <div class="plabel">SPECTRUM · 전체 주파수 (20Hz – 24kHz)</div>
    <canvas id="specCanvas"></canvas>
  </div>

  <!-- CONTROLS -->
  <div id="ctrlRow">
    <div class="cbox">
      <span class="clabel">TX FREQ</span>
      <div><span class="cval" id="vFreq">18000</span><span class="cunit">Hz</span></div>
      <input type="range" id="sFreq" min="17000" max="19000" step="250" value="18000">
    </div>
    <div class="cbox">
      <span class="clabel">INTERVAL</span>
      <div><span class="cval" id="vIntvl">1000</span><span class="cunit">ms</span></div>
      <input type="range" id="sIntvl" min="300" max="3000" step="100" value="1000">
    </div>
    <div class="cbox">
      <span class="clabel">PULSE</span>
      <div><span class="cval" id="vPulse">10</span><span class="cunit">ms</span></div>
      <input type="range" id="sPulse" min="5" max="50" step="5" value="10">
    </div>
    <div class="cbox">
      <span class="clabel">THRESH ×</span>
      <div><span class="cval" id="vThr">3.0</span></div>
      <input type="range" id="sThr" min="1.5" max="10" step="0.5" value="3">
    </div>
  </div>

  <!-- BUTTONS -->
  <div id="btnRow">
    <button id="btnFire">▶ START</button>
    <button class="btnS" id="btnVib">VIB</button>
    <button class="btnS" id="btnClr">CLR</button>
  </div>

  <!-- STATUS BAR -->
  <div id="statBar">
    <div class="sbox"><div class="slabel">RANGE</div><div class="sval" id="svRange">—</div></div>
    <div class="sbox"><div class="slabel">TOF</div><div class="sval" id="svTof">—</div></div>
    <div class="sbox"><div class="slabel">SNR</div><div class="sval" id="svSnr">—</div></div>
    <div class="sbox"><div class="slabel">TX CNT</div><div class="sval" id="svTxCnt">0</div></div>
    <div class="sbox"><div class="slabel">DETECT</div><div class="sval" id="svDet">—</div></div>
  </div>

</div>

<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const SOUND_SPEED = 343;
const FFT_SIZE    = 8192;     // freq resolution ~5.8Hz/bin @48kHz
const WINDOW_MS   = 400;      // RX listen window per ping
const IGNORE_MS   = 18;       // blank direct-blast zone
const BW_HZ       = 600;      // bandpass half-width

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let actx = null, analyser = null;
let running  = false;
let vibOn    = true;
let pingCnt  = 0;
let loopTid  = null;
let pingBusy = false;

// TX timeline: [{t_abs, freq, dur}]  — last 20 pings
let txLog = [];
const MAX_TX_LOG = 20;

// RX echo curves: [{pts:[{t,snr}], tof, range}]
let rxTraces = [];
const MAX_RX = 15;

// Live RX waveform ring buffer (time domain)
const RX_RING_SIZE = 2048;
let rxRing  = new Float32Array(RX_RING_SIZE);
let rxRingI = 0;

// Spectrum history (for waterfall effect on spectrum bar)
let specBuf = null;  // will be Float32Array

/* ══════════════════════════════════════════════════
   CANVAS REFS
══════════════════════════════════════════════════ */
const txC = document.getElementById('txCanvas'),  txX = txC.getContext('2d');
const rxC = document.getElementById('rxCanvas'),  rxX = rxC.getContext('2d');
const spC = document.getElementById('specCanvas'),spX = spC.getContext('2d');

/* ══════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════ */
function layout() {
  requestAnimationFrame(() => {
    [['txPanel','txCanvas'],['rxPanel','rxCanvas'],['specPanel','specCanvas']].forEach(([pid,cid]) => {
      const p = document.getElementById(pid);
      const c = document.getElementById(cid);
      c.width  = p.clientWidth  || 360;
      c.height = p.clientHeight || 120;
    });
    drawTxPanel();
    drawRxPanel();
    drawSpectrum();
  });
}
window.addEventListener('resize', layout);

/* ══════════════════════════════════════════════════
   SLIDERS
══════════════════════════════════════════════════ */
[['sFreq','vFreq'],['sIntvl','vIntvl'],['sPulse','vPulse'],['sThr','vThr']].forEach(([s,v])=>{
  document.getElementById(s).addEventListener('input', ()=>{
    document.getElementById(v).textContent = document.getElementById(s).value;
  });
});

/* ══════════════════════════════════════════════════
   AUDIO INIT
══════════════════════════════════════════════════ */
async function initAudio() {
  if (actx && analyser) return true;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000,
      latencyHint: 'interactive'
    });
    if (actx.state === 'suspended') await actx.resume();

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    });

    const src = actx.createMediaStreamSource(stream);

    // High-shelf +10dB above 15kHz to compensate mic rolloff
    const hs = actx.createBiquadFilter();
    hs.type = 'highshelf';
    hs.frequency.value = 15000;
    hs.gain.value = 10;

    analyser = actx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0;

    src.connect(hs);
    hs.connect(analyser);

    specBuf = new Float32Array(analyser.frequencyBinCount);
    setStatus('on','READY');
    return true;
  } catch(e) {
    toast('마이크 오류: ' + e.message, 4000);
    setStatus('','ERROR');
    return false;
  }
}

/* ══════════════════════════════════════════════════
   TRANSMIT  (chirp: center ± 400Hz)
══════════════════════════════════════════════════ */
function transmit(centerHz, durMs) {
  if (!actx) return;
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  const t    = actx.currentTime;
  const dur  = durMs / 1000;

  osc.type = 'sine';
  osc.frequency.setValueAtTime(centerHz - 400, t);
  osc.frequency.linearRampToValueAtTime(centerHz + 400, t + dur);

  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.92, t + dur * 0.08);
  gain.gain.setValueAtTime(0.92, t + dur * 0.92);
  gain.gain.linearRampToValueAtTime(0, t + dur);

  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.01);
}

/* ══════════════════════════════════════════════════
   BAND POWER  (FFT bins → mean linear power)
══════════════════════════════════════════════════ */
function bandPower(freqData, centerHz, bwHz) {
  const sr    = actx.sampleRate;
  const binHz = sr / FFT_SIZE;
  const b0 = Math.max(0,               Math.floor((centerHz - bwHz) / binHz));
  const b1 = Math.min(freqData.length-1, Math.ceil((centerHz + bwHz) / binHz));
  let sum = 0;
  for (let b = b0; b <= b1; b++) sum += Math.pow(10, freqData[b] / 10);
  return sum / Math.max(1, b1 - b0 + 1);
}

/* ══════════════════════════════════════════════════
   SINGLE PING
══════════════════════════════════════════════════ */
async function doPing() {
  if (pingBusy || !actx) return;
  pingBusy = true;

  const freq    = parseInt(document.getElementById('sFreq').value);
  const pulseMs = parseInt(document.getElementById('sPulse').value);
  const thrMult = parseFloat(document.getElementById('sThr').value);
  const sr      = actx.sampleRate;

  // ── TX ──
  pingCnt++;
  txLog.push({ t: Date.now(), freq, dur: pulseMs });
  if (txLog.length > MAX_TX_LOG) txLog.shift();
  document.getElementById('svTxCnt').textContent = pingCnt;
  document.getElementById('txBadge').textContent = freq + 'Hz';
  setStatus('tx', 'TX');

  transmit(freq, pulseMs);
  drawTxPanel(true);

  await sleep(pulseMs + Math.max(18, pulseMs * 0.8));

  // ── NOISE FLOOR (4 frames) ──
  setStatus('rx', 'RX');
  const fdBuf = new Float32Array(analyser.frequencyBinCount);
  const tdBuf = new Float32Array(analyser.fftSize);
  let noiseAcc = 0;
  for (let i = 0; i < 4; i++) {
    await nextFrame();
    analyser.getFloatFrequencyData(fdBuf);
    noiseAcc += bandPower(fdBuf, freq, BW_HZ);
  }
  const noiseFloor = Math.max(noiseAcc / 4, 1e-12);

  // ── RX COLLECT ──
  const msPerFrame = FFT_SIZE / sr * 1000;
  const nFrames    = Math.ceil(WINDOW_MS / msPerFrame);
  const pts = [];

  for (let i = 0; i < nFrames; i++) {
    await nextFrame();

    // Freq domain → band SNR
    analyser.getFloatFrequencyData(fdBuf);
    const snr = bandPower(fdBuf, freq, BW_HZ) / noiseFloor;
    pts.push({ t: i * msPerFrame, snr });

    // Time domain → live waveform ring buffer
    analyser.getFloatTimeDomainData(tdBuf);
    for (let s = 0; s < tdBuf.length; s++) {
      rxRing[rxRingI % RX_RING_SIZE] = tdBuf[s];
      rxRingI++;
    }

    // Update spectrum
    specBuf.set(fdBuf);
    drawSpectrum(freq);
    drawRxLive();
  }

  // ── PROCESS ECHO ──
  const result = processEcho(pts, thrMult, noiseFloor);

  // ── UPDATE TX PANEL ──
  drawTxPanel(false);

  pingBusy = false;
  if (running) setStatus('on', 'WAIT');
  else         setStatus('on', 'READY');

  return result;
}

/* ══════════════════════════════════════════════════
   PROCESS ECHO
══════════════════════════════════════════════════ */
function processEcho(pts, thrMult, noiseFloor) {
  // Weighted smooth
  const sm = pts.map((p, i) => {
    const a = pts[Math.max(0,i-1)].snr;
    const b = p.snr;
    const c = pts[Math.min(pts.length-1,i+1)].snr;
    return { t: p.t, snr: (a + b*2 + c)/4 };
  });

  const maxSnr = Math.max(...sm.map(p=>p.snr), 1);

  // First peak above threshold after ignore zone
  let echoPt = null;
  for (const p of sm) {
    if (p.t < IGNORE_MS) continue;
    if (p.snr >= thrMult) { echoPt = p; break; }
  }

  const tof   = echoPt ? echoPt.t : null;
  const range = tof    ? (tof/1000)*SOUND_SPEED/2 : null;
  const snrDb = echoPt ? (10*Math.log10(echoPt.snr)).toFixed(1) : null;

  // Update stats
  const rv = document.getElementById('svRange');
  if (range !== null && range < 20) {
    rv.textContent = range.toFixed(2)+'m';
    rv.classList.toggle('hi', range < 1.5);
    document.getElementById('rxBadge').textContent = range.toFixed(2)+'m';
  } else {
    rv.textContent = 'N/D';
    rv.classList.remove('hi');
    document.getElementById('rxBadge').textContent = '—';
  }
  document.getElementById('svTof').textContent  = tof   ? tof.toFixed(1)+'ms' : '—';
  document.getElementById('svSnr').textContent  = snrDb ? snrDb+'dB'          : '—';
  document.getElementById('svDet').textContent  = echoPt ? 'YES' : 'NO';
  document.getElementById('svDet').classList.toggle('hi', !!echoPt);

  // Vibrate on detection
  if (echoPt && vibOn && range < 5) {
    const pattern = range < 1 ? [80,40,80] : range < 2 ? [60] : [30];
    if (navigator.vibrate) navigator.vibrate(pattern);
    document.getElementById('vibIcon').classList.add('on');
    setTimeout(()=>document.getElementById('vibIcon').classList.remove('on'), 400);
  }

  // Store trace
  rxTraces.push({ pts: sm, tof, range, maxSnr });
  if (rxTraces.length > MAX_RX) rxTraces.shift();

  drawRxEcho(sm, maxSnr, tof, thrMult);
  return { tof, range };
}

/* ══════════════════════════════════════════════════
   DRAW: TX PANEL
   Shows TX timing pulses as vertical bars on timeline
══════════════════════════════════════════════════ */
function drawTxPanel(firing) {
  const W = txC.width, H = txC.height;
  txX.clearRect(0, 0, W, H);

  // Background grid
  txX.strokeStyle = 'rgba(0,60,20,0.3)';
  txX.lineWidth = 1;
  for (let i=0; i<=10; i++) {
    const x = i/10*W;
    txX.beginPath(); txX.moveTo(x,0); txX.lineTo(x,H); txX.stroke();
  }
  // Zero line
  txX.strokeStyle = 'rgba(0,120,50,0.5)';
  txX.beginPath(); txX.moveTo(0,H*0.7); txX.lineTo(W,H*0.7); txX.stroke();

  if (!txLog.length) {
    txX.fillStyle = 'rgba(0,120,50,0.35)';
    txX.font = '10px Share Tech Mono';
    txX.textAlign = 'center';
    txX.fillText('START 버튼을 눌러 송신 시작', W/2, H/2+4);
    return;
  }

  const now      = Date.now();
  const intvlMs  = parseInt(document.getElementById('sIntvl').value);
  const viewMs   = Math.max(intvlMs * 4, 3000); // show last N ms
  const tLeft    = now - viewMs;

  // Time axis labels
  txX.fillStyle = 'rgba(0,120,50,0.5)';
  txX.font = '8px Share Tech Mono';
  txX.textAlign = 'center';
  for (let i=0; i<=4; i++) {
    const ms  = viewMs * i / 4;
    const x   = (i/4)*W;
    txX.fillText((viewMs/4*(4-i)/1000).toFixed(1)+'s', x, H-2);
  }

  // Draw TX pulses
  txLog.forEach((tx, idx) => {
    const age = now - tx.t;
    if (age > viewMs) return;
    const x   = (1 - age/viewMs) * W;
    const pxW = Math.max(3, (tx.dur/viewMs)*W);
    const alpha = Math.max(0.15, 1 - age/viewMs);

    // Pulse bar
    const barH = H * 0.65;
    txX.fillStyle = `rgba(255,184,0,${alpha * 0.25})`;
    txX.fillRect(x, H*0.7-barH, pxW, barH);

    txX.strokeStyle = `rgba(255,184,0,${alpha})`;
    txX.lineWidth = alpha > 0.5 ? 2 : 1;
    txX.strokeRect(x, H*0.7-barH, pxW, barH);

    // Freq label on most recent
    if (idx === txLog.length-1 && alpha > 0.4) {
      txX.fillStyle = `rgba(255,184,0,${alpha})`;
      txX.font = '8px Share Tech Mono';
      txX.textAlign = 'left';
      txX.fillText(tx.freq+'Hz', x+2, H*0.7-barH-3);
    }
  });

  // Interval ruler
  txX.strokeStyle = 'rgba(0,200,100,0.2)';
  txX.lineWidth = 1;
  txX.setLineDash([2,4]);
  const intvlX = (intvlMs/viewMs)*W;
  if (intvlX < W) {
    const lastTx = txLog[txLog.length-1];
    const lastX  = (1 - (now-lastTx.t)/viewMs)*W;
    // Next expected ping line
    const nextX = lastX + intvlX;
    if (nextX < W) {
      txX.beginPath(); txX.moveTo(nextX,0); txX.lineTo(nextX,H); txX.stroke();
      txX.fillStyle='rgba(0,180,80,0.4)';
      txX.font='8px Share Tech Mono';
      txX.textAlign='left';
      txX.fillText('next', nextX+2, 12);
    }
  }
  txX.setLineDash([]);

  // Firing flash
  if (firing) {
    txX.fillStyle = 'rgba(255,184,0,0.12)';
    txX.fillRect(0,0,W,H);
  }
}

/* ══════════════════════════════════════════════════
   DRAW: RX LIVE WAVEFORM  (time domain ring buffer)
══════════════════════════════════════════════════ */
function drawRxLive() {
  const W = rxC.width, H = rxC.height;
  // Draw on top half only (bottom half = echo envelope)
  const halfH = Math.floor(H * 0.45);
  rxX.clearRect(0, 0, W, halfH);

  // Grid
  rxX.strokeStyle = 'rgba(0,60,20,0.3)';
  rxX.lineWidth = 1;
  for (let i=0;i<=8;i++) {
    rxX.beginPath(); rxX.moveTo(i/8*W,0); rxX.lineTo(i/8*W,halfH); rxX.stroke();
  }
  rxX.strokeStyle = 'rgba(0,60,20,0.4)';
  rxX.beginPath(); rxX.moveTo(0,halfH/2); rxX.lineTo(W,halfH/2); rxX.stroke();

  // Waveform from ring buffer
  const disp = Math.min(RX_RING_SIZE, W * 2);
  rxX.beginPath();
  rxX.strokeStyle = '#00ff88';
  rxX.lineWidth = 1.2;
  rxX.shadowBlur = 3; rxX.shadowColor = '#00ff88';
  for (let i = 0; i < disp; i++) {
    const idx = (rxRingI - disp + i + RX_RING_SIZE) % RX_RING_SIZE;
    const v   = rxRing[idx];
    const x   = (i / disp) * W;
    const y   = halfH/2 - v * (halfH/2 - 2);
    i === 0 ? rxX.moveTo(x,y) : rxX.lineTo(x,y);
  }
  rxX.stroke();
  rxX.shadowBlur = 0;

  // Label
  rxX.fillStyle = 'rgba(0,100,50,0.6)';
  rxX.font = '7px Share Tech Mono';
  rxX.textAlign = 'left';
  rxX.fillText('TIME DOMAIN', 4, 11);
}

/* ══════════════════════════════════════════════════
   DRAW: RX ECHO ENVELOPE (bottom half of RX panel)
══════════════════════════════════════════════════ */
function drawRxEcho(pts, maxSnr, tofMs, thrMult) {
  const W = rxC.width, H = rxC.height;
  const top = Math.floor(H * 0.5);
  const hh  = H - top;

  rxX.clearRect(0, top, W, hh);

  // Divider
  rxX.strokeStyle = 'rgba(0,100,40,0.4)';
  rxX.lineWidth = 1;
  rxX.beginPath(); rxX.moveTo(0,top); rxX.lineTo(W,top); rxX.stroke();

  // Grid
  rxX.strokeStyle = 'rgba(0,50,20,0.3)';
  for (let i=0;i<=10;i++) {
    const x=(i/10)*W;
    rxX.beginPath(); rxX.moveTo(x,top); rxX.lineTo(x,H); rxX.stroke();
  }

  // Range axis
  rxX.fillStyle = 'rgba(0,120,55,0.6)';
  rxX.font = '7px Share Tech Mono';
  rxX.textAlign = 'center';
  for (let i=1;i<=5;i++) {
    const tMs  = WINDOW_MS*i/5;
    const dist = (tMs/1000)*SOUND_SPEED/2;
    rxX.fillText(dist.toFixed(1)+'m', (i/5)*W, H-2);
  }

  if (!pts || !pts.length) return;

  // Old traces
  for (let ti=0; ti<rxTraces.length-1; ti++) {
    const age   = rxTraces.length-1-ti;
    const alpha = Math.max(0, 0.25 - age*0.018);
    if (alpha<=0) continue;
    const tr = rxTraces[ti];
    rxX.beginPath();
    rxX.strokeStyle = `rgba(0,200,100,${alpha})`;
    rxX.lineWidth = 1;
    for (let j=0;j<tr.pts.length;j++) {
      const px = (tr.pts[j].t/WINDOW_MS)*W;
      const py = H - (tr.pts[j].snr/tr.maxSnr)*(hh-8)-4;
      j===0 ? rxX.moveTo(px,py) : rxX.lineTo(px,py);
    }
    rxX.stroke();
  }

  // Ignore zone
  const ignX = (IGNORE_MS/WINDOW_MS)*W;
  rxX.fillStyle = 'rgba(255,60,60,0.06)';
  rxX.fillRect(0, top, ignX, hh);
  rxX.strokeStyle = 'rgba(255,80,80,0.2)';
  rxX.lineWidth = 1;
  rxX.setLineDash([2,3]);
  rxX.beginPath(); rxX.moveTo(ignX,top); rxX.lineTo(ignX,H); rxX.stroke();
  rxX.setLineDash([]);

  // Threshold line
  const thrN = Math.min(thrMult/maxSnr,1);
  const thrY = H - thrN*(hh-8)-4;
  rxX.strokeStyle = 'rgba(255,184,0,0.4)';
  rxX.lineWidth = 1;
  rxX.setLineDash([4,4]);
  rxX.beginPath(); rxX.moveTo(0,thrY); rxX.lineTo(W,thrY); rxX.stroke();
  rxX.setLineDash([]);

  // Fill
  rxX.beginPath();
  rxX.moveTo(0, H);
  for (let i=0;i<pts.length;i++) {
    const px = (pts[i].t/WINDOW_MS)*W;
    const py = H - (pts[i].snr/maxSnr)*(hh-8)-4;
    rxX.lineTo(px,py);
  }
  rxX.lineTo(W,H);
  rxX.closePath();
  const fg = rxX.createLinearGradient(0,top,0,H);
  fg.addColorStop(0,'rgba(0,255,136,0.4)');
  fg.addColorStop(1,'rgba(0,255,136,0.02)');
  rxX.fillStyle = fg;
  rxX.fill();

  // Line
  rxX.beginPath();
  rxX.strokeStyle = '#00ff88';
  rxX.lineWidth = 1.8;
  rxX.shadowBlur = 5; rxX.shadowColor = '#00ff88';
  for (let i=0;i<pts.length;i++) {
    const px = (pts[i].t/WINDOW_MS)*W;
    const py = H - (pts[i].snr/maxSnr)*(hh-8)-4;
    i===0 ? rxX.moveTo(px,py) : rxX.lineTo(px,py);
  }
  rxX.stroke();
  rxX.shadowBlur = 0;

  // TOF marker
  if (tofMs !== null) {
    const tx    = (tofMs/WINDOW_MS)*W;
    const range = (tofMs/1000)*SOUND_SPEED/2;
    rxX.strokeStyle = '#ffb800';
    rxX.lineWidth = 2;
    rxX.shadowBlur = 7; rxX.shadowColor = '#ffb800';
    rxX.setLineDash([3,3]);
    rxX.beginPath(); rxX.moveTo(tx,top); rxX.lineTo(tx,H); rxX.stroke();
    rxX.setLineDash([]);
    rxX.shadowBlur = 0;
    rxX.fillStyle = '#ffb800';
    rxX.font = 'bold 9px Share Tech Mono';
    rxX.textAlign = tx>W*0.7?'right':'left';
    rxX.fillText('◆ '+range.toFixed(2)+'m', tx+(tx>W*0.7?-4:4), top+12);
  }

  // Label
  rxX.fillStyle = 'rgba(0,100,50,0.6)';
  rxX.font = '7px Share Tech Mono';
  rxX.textAlign = 'left';
  rxX.fillText('ECHO ENVELOPE · SNR', 4, top+10);
}

/* ══════════════════════════════════════════════════
   DRAW: FULL SPECTRUM  (20Hz – Nyquist)
   두 영역 색상 구분:
   가청(20Hz~20kHz) = 초록 계열
   초음파(20kHz+)   = 파란 계열
   TX 주파수         = 황색 마커
══════════════════════════════════════════════════ */
function drawSpectrum(txFreq) {
  const W = spC.width, H = spC.height;
  spX.clearRect(0, 0, W, H);

  const sr    = actx ? actx.sampleRate : 48000;
  const nyq   = sr / 2;        // max displayable freq
  const binHz = sr / FFT_SIZE;

  // Background grid
  spX.strokeStyle = 'rgba(0,60,20,0.3)';
  spX.lineWidth = 1;
  // Freq markers: 100Hz, 500Hz, 1k, 2k, 4k, 8k, 12k, 16k, 20k
  const markers = [100,200,500,1000,2000,4000,8000,12000,16000,20000];
  markers.forEach(f => {
    if (f > nyq) return;
    const x = (f / nyq) * W;
    spX.beginPath(); spX.moveTo(x,0); spX.lineTo(x,H); spX.stroke();
    spX.fillStyle = 'rgba(0,120,50,0.55)';
    spX.font = '7px Share Tech Mono';
    spX.textAlign = 'center';
    const label = f>=1000 ? (f/1000)+'k' : f+'';
    spX.fillText(label, x, H-2);
  });

  if (!specBuf) {
    spX.fillStyle = 'rgba(0,120,50,0.35)';
    spX.font = '10px Share Tech Mono';
    spX.textAlign = 'center';
    spX.fillText('START 후 스펙트럼 표시', W/2, H/2+4);
    return;
  }

  const bins = specBuf.length; // frequencyBinCount = FFT_SIZE/2

  // Draw spectrum bars
  const barW = Math.max(1, W / bins * 4); // not all bins shown, subsample
  const step = Math.max(1, Math.floor(bins / W));

  for (let b = 0; b < bins; b += step) {
    const f    = b * binHz;
    if (f > nyq) break;
    const x    = (f / nyq) * W;
    const db   = specBuf[b];
    const norm = Math.min(1, Math.max(0, (db + 90) / 75));
    const barH = norm * (H - 14);

    // Color: 가청 영역(< 20kHz) = green, 초음파(≥ 20kHz) = cyan
    let R, G, B;
    if (f < 20000) {
      // green gradient by amplitude
      if (norm < 0.5) { R=0; G=Math.floor(norm*2*180); B=0; }
      else { const t=(norm-0.5)*2; R=Math.floor(t*80); G=Math.floor(180+t*75); B=Math.floor(t*40); }
    } else {
      // cyan for ultrasonic
      if (norm < 0.5) { R=0; G=Math.floor(norm*2*150); B=Math.floor(norm*2*200); }
      else { const t=(norm-0.5)*2; R=Math.floor(t*100); G=Math.floor(150+t*80); B=Math.floor(200+t*55); }
    }

    spX.fillStyle = `rgb(${R},${G},${B})`;
    spX.fillRect(x, H-14-barH, Math.max(1, (step*binHz/nyq)*W*1.2), barH);
  }

  // 가청/초음파 경계선 (20kHz)
  const boundX = (20000 / nyq) * W;
  if (boundX < W) {
    spX.strokeStyle = 'rgba(0,200,255,0.5)';
    spX.lineWidth = 1.5;
    spX.setLineDash([3,3]);
    spX.beginPath(); spX.moveTo(boundX,0); spX.lineTo(boundX,H-12); spX.stroke();
    spX.setLineDash([]);
    spX.fillStyle = 'rgba(0,200,255,0.6)';
    spX.font = '7px Share Tech Mono';
    spX.textAlign = 'left';
    spX.fillText('20k', boundX+2, 10);
  }

  // TX freq marker (amber)
  const txF = txFreq || parseInt(document.getElementById('sFreq').value);
  const txX_ = (txF / nyq) * W;
  spX.strokeStyle = 'rgba(255,184,0,0.9)';
  spX.lineWidth = 2;
  spX.shadowBlur = 6; spX.shadowColor = '#ffb800';
  spX.beginPath(); spX.moveTo(txX_,0); spX.lineTo(txX_,H-12); spX.stroke();
  spX.shadowBlur = 0;
  spX.fillStyle = '#ffb800';
  spX.font = 'bold 7px Share Tech Mono';
  spX.textAlign = txX_>W*0.85?'right':'left';
  spX.fillText('TX', txX_+(txX_>W*0.85?-3:3), 10);

  // dB scale on Y axis
  spX.fillStyle = 'rgba(0,120,50,0.5)';
  spX.font = '7px Share Tech Mono';
  spX.textAlign = 'right';
  spX.fillText('-90dB', W-2, H-15);
  spX.fillText('-15dB', W-2, 10);
}

/* ══════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════ */
async function startLoop() {
  if (!await initAudio()) return;
  running = true;
  document.getElementById('btnFire').textContent = '■ STOP';
  document.getElementById('btnFire').classList.add('on');
  setStatus('on','ACTIVE');

  // Realtime spectrum animation (even between pings)
  startSpecAnim();

  const intvlMs = () => parseInt(document.getElementById('sIntvl').value);

  async function loop() {
    if (!running) return;
    await doPing();
    if (running) loopTid = setTimeout(loop, intvlMs());
  }
  loop();
}

function stopLoop() {
  running = false;
  if (loopTid) { clearTimeout(loopTid); loopTid = null; }
  document.getElementById('btnFire').textContent = '▶ START';
  document.getElementById('btnFire').classList.remove('on');
  setStatus('on','READY');
  stopSpecAnim();
}

/* ══════════════════════════════════════════════════
   SPECTRUM REALTIME ANIMATION (between pings too)
══════════════════════════════════════════════════ */
let specAnimId = null;
function startSpecAnim() {
  if (specAnimId) return;
  const fdBuf = new Float32Array(analyser ? analyser.frequencyBinCount : FFT_SIZE/2);
  function frame() {
    if (!running) { specAnimId = null; return; }
    if (analyser) {
      analyser.getFloatFrequencyData(fdBuf);
      specBuf = fdBuf;
    }
    drawSpectrum();
    drawTxPanel(false);
    specAnimId = requestAnimationFrame(frame);
  }
  specAnimId = requestAnimationFrame(frame);
}
function stopSpecAnim() {
  if (specAnimId) { cancelAnimationFrame(specAnimId); specAnimId = null; }
}

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function nextFrame() { return new Promise(r => requestAnimationFrame(r)); }
function sleep(ms)   { return new Promise(r => setTimeout(r, ms)); }

function setStatus(cls, txt) {
  document.getElementById('dot').className = cls;
  document.getElementById('stxt').textContent = txt;
}

let toastTid = null;
function toast(msg, dur=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTid) clearTimeout(toastTid);
  toastTid = setTimeout(()=>el.classList.remove('show'), dur);
}

function redrawAll() {
  drawTxPanel(false);
  drawRxLive();
  drawSpectrum();
}

/* ══════════════════════════════════════════════════
   BUTTON EVENTS
══════════════════════════════════════════════════ */
let firePending = false;
document.getElementById('btnFire').addEventListener('pointerdown', async e => {
  e.preventDefault();
  if (firePending) return;
  firePending = true;
  if (!running) await startLoop();
  else           stopLoop();
  firePending = false;
});

document.getElementById('btnVib').addEventListener('click', () => {
  vibOn = !vibOn;
  document.getElementById('btnVib').classList.toggle('on', vibOn);
  if (vibOn && navigator.vibrate) navigator.vibrate(50);
  toast(vibOn ? '진동 알림 ON' : '진동 알림 OFF');
});

document.getElementById('btnClr').addEventListener('click', () => {
  rxTraces = []; txLog = [];
  rxRing.fill(0); rxRingI = 0;
  pingCnt = 0;
  ['svRange','svTof','svSnr','svDet'].forEach(id => {
    document.getElementById(id).textContent = '—';
    document.getElementById(id).classList.remove('hi');
  });
  document.getElementById('svTxCnt').textContent = '0';
  document.getElementById('txBadge').textContent = '—';
  document.getElementById('rxBadge').textContent = '—';
  redrawAll();
});

/* ══════════════════════════════════════════════════
   VIB BUTTON DEFAULT ON
══════════════════════════════════════════════════ */
document.getElementById('btnVib').classList.add('on');

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
layout();

if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  setTimeout(()=>toast('⚠ HTTPS / localhost 환경에서만 마이크 사용 가능', 5000), 500);
}
